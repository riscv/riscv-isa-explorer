name: Sync UDB Extensions

on:
  # Run daily at 06:00 UTC.
  #
  # Was weekly, which meant a UDB change could sit unreflected here for six days.
  # Daily is safe rather than noisy: the pull request step is guarded on an
  # actual diff, so a quiet day produces nothing at all, and create-pull-request
  # reuses one branch, so consecutive days with drift update the same pull
  # request instead of stacking new ones.
  schedule:
    - cron: '0 6 * * *'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Note: the "Create Pull Request" step requires the repo/org setting
# "Allow GitHub Actions to create and approve pull requests" to be enabled.
permissions:
  contents: write
  pull-requests: write

# Serialize runs so a manual dispatch and the weekly cron can't collide on
# the shared PR branch. Queue rather than cancel — we don't want to abort a
# run that may be mid-commit.
concurrency:
  group: sync-udb-extensions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the explorer repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Clone riscv-unified-db
        id: udb
        run: |
          # Canonical location. riscv-software-src/ still redirects here, but
          # relying on a redirect is one rename away from a silent failure.
          git clone --depth 1 https://github.com/riscv/riscv-unified-db.git ../riscv-unified-db
          echo "sha=$(git -C ../riscv-unified-db rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Sync extension metadata
        run: node scripts/sync_udb_extensions.cjs ../riscv-unified-db

      # Dependencies come from the graph, not the catalog — one parser, one
      # source of truth. Regenerating here means a new UDB extension arrives as
      # a PR with its graph node already present, instead of one that trips the
      # completeness gate in CI.
      - name: Reseed the dependency graph
        run: node scripts/seed-dependency-graph.mjs --udb ../riscv-unified-db

      # Parameter DEFINITIONS, not values. Folded into this job rather than given
      # its own cron because it reads the same clone at the same commit: one UDB
      # change should produce one pull request, not two that a reviewer has to
      # correlate. The file is sorted and carries no timestamp, so an unchanged
      # upstream produces no diff and no PR.
      - name: Sync parameter definitions
        run: node scripts/sync_udb_params.mjs ../riscv-unified-db

      - name: Build
        run: npm run build

      - name: Validate the result
        run: npm test

      - name: Check for changes
        id: changes
        run: |
          # All three synced files, not just the first two. A UDB release that
          # touches only spec/std/isa/param/ changes src/isa-params.json and
          # nothing else; left out of this list, that sync would run, write the
          # file, find "no changes", open no pull request, and throw the update
          # away with the runner. Silently, once per day.
          SYNCED="src/riscv_extensions.json src/isa-dependency-graph.json src/isa-params.json"
          if git diff --quiet $SYNCED; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new extension or parameter data in UDB."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New data found — opening PR."
            git diff --stat $SYNCED
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: 'feat: sync extension data from riscv-unified-db'
          # The DCO gate matches the Signed-off-by trailer against the commit
          # author (%an <%ae>), while this action's `signoff` writes the trailer
          # from the *committer*. They differ by default — `author` falls back to
          # whoever triggered the run — so the trailer would never match. Pinning
          # both to the bot makes the sign-off valid, and keeps sync commits from
          # being attributed to whoever happened to click "Run workflow".
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          # sign-commits, because `main` carries a required_signatures rule and
          # this action does NOT sign by default (`sign-commits` defaults to
          # false, and v6 had no such input at all — it was added in v7). Every
          # automated PR was therefore opened with an unsigned commit and could
          # not be merged, while the DCO check stayed green and made it look
          # fine. Sign-off and signature are different things: `signoff` writes a
          # Signed-off-by trailer, which is plain text; required_signatures wants
          # a cryptographic one. With sign-commits the action commits through the
          # GitHub API and GitHub signs with its own key.
          sign-commits: true
          signoff: true
          title: 'feat: sync extension data from UDB'
          body: |
            Automated sync from [riscv-unified-db](https://github.com/riscv/riscv-unified-db).

            **Synced from UDB commit `${{ steps.udb.outputs.sha }}`** — reproduce
            this run locally with:

            ```
            git clone https://github.com/riscv/riscv-unified-db.git ../riscv-unified-db
            git -C ../riscv-unified-db checkout ${{ steps.udb.outputs.sha }}
            node scripts/sync_udb_extensions.cjs ../riscv-unified-db
            node scripts/seed-dependency-graph.mjs --udb ../riscv-unified-db
            node scripts/sync_udb_params.mjs ../riscv-unified-db
            ```

            Three files may change, and they come from different parsers:

            - `src/riscv_extensions.json` — extension metadata (CSRs, `long_name`,
              `type`, `state`, `ratification_date`, `behavior`).
            - `src/isa-dependency-graph.json` — the dependency graph, with a
              citation on every edge.
            - `src/isa-params.json` — UDB parameter definitions: what each
              parameter is and what values it admits. Definitions only, no values.
              A new parameter here is additive; a CHANGED `schema` on an existing
              one is worth reading closely, because
              `tests/isa-params.test.mjs` checks the graph's own constraints
              against these schemas and a narrowed enum can invalidate one.

            `npm test` passed before this PR was opened, so the graph is
            structurally valid and every catalog extension has a node. Review the
            `desc` and dependency changes in particular — UDB descriptions are
            hard-wrapped block scalars, and requirement blocks use conditional
            forms that must not be read as hard dependencies.

            Generated by the `sync-udb-extensions` workflow.
          branch: automated/sync-udb-extensions
          labels: automated,data-sync
