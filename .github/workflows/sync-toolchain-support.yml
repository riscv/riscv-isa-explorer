name: Sync toolchain support

on:
  # Monthly, the 1st at 10:00 UTC. The fastest of the five, Linux, releases
  # about every nine weeks, so weekly would mostly find nothing.
  #
  # A pull request opens when a new release is scanned or an extension's
  # standing changes. create-pull-request reuses one branch, so an unmerged
  # update keeps refreshing the same pull request.
  schedule:
    - cron: '0 10 1 * *'

  workflow_dispatch:

# The "Create Pull Request" step needs the repo/org setting "Allow GitHub
# Actions to create and approve pull requests".
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-toolchain-support
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the explorer repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # Lists LLVM, GCC, binutils, QEMU and Linux release tags and fetches one
      # source file per release (binutils from sourceware, the rest from
      # GitHub). A release whose file moved fails here, by design: the parser
      # in scripts/toolchain-support.mjs needs a look.
      - name: Sync toolchain support
        run: node scripts/sync_toolchain_support.mjs --report "$RUNNER_TEMP/report.md"

      - name: Summarise
        run: cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      # The render smoke test mounts the built bundle, so npm test needs dist/.
      - name: Build
        run: npm run build

      # tests/toolchain-support.test.mjs pins facts from the release notes and
      # checks Compiler Explorer's exclusion list against the data.
      - name: Validate the result
        run: npm test

      - name: Decide whether to open a pull request
        id: changes
        run: |
          if git diff --quiet src/toolchain-support.json || ! grep -q '^changed: true' "$RUNNER_TEMP/report.md"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo 'report<<REPORT_EOF'
              tail -n +3 "$RUNNER_TEMP/report.md"
              echo 'REPORT_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: 'data: sync toolchain support'
          # Same identity for author and committer, so the Signed-off-by trailer
          # matches the author and DCO passes; sign-commits because main requires
          # signed commits. See sync-udb-extensions.yml for the full story.
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          sign-commits: true
          signoff: true
          title: 'data: sync toolchain support'
          body: |
            Automated sync of which Clang, GCC, binutils, QEMU and Linux releases
            know each extension, read from each release's source.

            ${{ steps.changes.outputs.report }}

            Reproduce locally: `npm run sync:toolchains`.

            `npm test` passed before this pull request was opened.

            Generated by the `sync-toolchain-support` workflow.
          branch: automated/sync-toolchain-support
          labels: automated,data-sync
