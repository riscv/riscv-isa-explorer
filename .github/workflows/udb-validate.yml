name: UDB Export Check

# Runs riscv-unified-db's own config validator (`udb validate cfg`) on the
# builder's UDB export (#589).
#
# WHY THIS EXISTS
#
# The export once failed UDB's validator on every configuration while every
# test here passed: Sm missing, 68 required parameters absent, a key written
# twice. Only UDB knows what UDB requires, so UDB is the judge.
#
# Matrix mode (pull requests, weekly, a manual run with no inputs) exports every
# profile and each catalogue extension alone on RV64I and RV32I, fills the
# TODOs (scripts/udb-validate/fill.mjs) and validates all of them in one Ruby
# process. It fails only on a STRUCTURAL failure (missing, undefined or unknown
# parameter, extension or version; an unmet requirement between extensions; a
# UDB crash) that scripts/udb-validate/baseline.json does not accept. Value
# failures come from the filled values and are reported only.
#
# A manual run with `selection`, `cfg` or `config_path` checks that one
# configuration and fails on any reason. Inputs are visible in the run log of
# a public repository: never paste an unreleased core's configuration here.
# Run the same container locally instead (scripts/udb-validate/README.md).

on:
  pull_request:
    paths:
      - 'src/exportUtils.js'
      - 'src/isaParams.js'
      - 'src/isaGraph.js'
      - 'src/isa-params.json'
      - 'src/isa-dependency-graph.json'
      - 'src/riscv_extensions.json'
      - 'scripts/udb-validate/**'
      - '.github/workflows/udb-validate.yml'
  # Weekly, 10:00 UTC Monday, after the other UDB jobs (06:00-09:00).
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      selection:
        description: 'Extensions to export and check, comma-separated (RV64I,M,A,C). Empty: the full matrix.'
        required: false
      cfg:
        description: 'A builder share link value (the part after ?cfg=)'
        required: false
      config_path:
        description: 'Path in this repository to a UDB config to check as it is'
        required: false
      udb_ref:
        description: 'riscv-unified-db commit or branch. Default: the commit our data is pinned to.'
        required: false

permissions:
  contents: read

concurrency:
  group: udb-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.configs.outputs.mode }}
      udb_ref: ${{ steps.ref.outputs.udb_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Pick the UDB commit
        id: ref
        env:
          INPUT_REF: ${{ inputs.udb_ref }}
        run: |
          ref="$INPUT_REF"
          if [ -z "$ref" ]; then
            ref=$(node -p "require('./src/isa-dependency-graph.json').sources.udb.commit")
          fi
          echo "udb_ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Write the configurations
        id: configs
        env:
          SELECTION: ${{ inputs.selection }}
          CFG: ${{ inputs.cfg }}
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          mkdir -p configs
          if [ -n "$CONFIG_PATH" ]; then
            case "$CONFIG_PATH" in /*|*..*) echo "config_path must be inside the repository"; exit 1;; esac
            cp -- "$CONFIG_PATH" configs/given.yaml
            echo "mode=single" >> "$GITHUB_OUTPUT"
          elif [ -n "$SELECTION" ]; then
            node scripts/udb-validate/generate.mjs --out configs --selection "$SELECTION"
            echo "mode=single" >> "$GITHUB_OUTPUT"
          elif [ -n "$CFG" ]; then
            node scripts/udb-validate/generate.mjs --out configs --cfg "$CFG"
            echo "mode=single" >> "$GITHUB_OUTPUT"
          else
            node scripts/udb-validate/generate.mjs --out configs
            echo "mode=matrix" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: udb-configs
          path: configs/
          retention-days: 7

  validate:
    needs: generate
    runs-on: ubuntu-latest
    # Four shards of ~100 configurations, a few seconds each on a runner. One
    # job took over 30 minutes for all 402.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 30
    container: ruby:3.4.11-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: udb-configs
          path: configs
      # Everything lives under the workspace: hashFiles() and the cache only
      # see files there.
      - name: Check out riscv-unified-db
        env:
          REF: ${{ needs.generate.outputs.udb_ref }}
        run: |
          git init -q udb
          git -C udb fetch -q --depth 1 https://github.com/riscv/riscv-unified-db.git "$REF"
          git -C udb checkout -q FETCH_HEAD
          echo "riscv-unified-db at $(git -C udb rev-parse HEAD)"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .udb-bundle
            .udb-cache
          key: udb-${{ hashFiles('udb/Gemfile.lock', 'udb/tools/ruby-gems/udb/lib/udb/Z3_VERSION') }}
      # UDB merges and resolves its whole spec into gen/ before checking
      # anything; that depends only on the UDB commit, so it is kept.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            udb/gen/spec
            udb/gen/resolved_spec
          key: udb-gen-${{ needs.generate.outputs.udb_ref }}
      - name: Install udb
        run: |
          export BUNDLE_PATH="$GITHUB_WORKSPACE/.udb-bundle" XDG_CACHE_HOME="$GITHUB_WORKSPACE/.udb-cache"
          export BUNDLE_LOCKFILE_CHECKSUMS=false
          cd udb
          bundle install --jobs 4 --quiet
          # Fetches UDB's pinned Z3 build, which udb loads at run time.
          (cd /tmp && bundle exec --gemfile "$GITHUB_WORKSPACE/udb/Gemfile" ruby "$GITHUB_WORKSPACE/udb/tools/ruby-gems/udb/ext/udb_download/extconf.rb")
      - name: Validate
        run: |
          export BUNDLE_PATH="$GITHUB_WORKSPACE/.udb-bundle" XDG_CACHE_HOME="$GITHUB_WORKSPACE/.udb-cache"
          export BUNDLE_LOCKFILE_CHECKSUMS=false
          # This shard's share: every fourth file, in name order.
          ls "$GITHUB_WORKSPACE"/configs/*.yaml | sort | awk -v s="$SHARD" 'NR % 4 == s' > shard.txt
          echo "shard $SHARD: $(wc -l < shard.txt) configurations"
          cd udb
          if [ -s ../shard.txt ]; then
            xargs bundle exec ruby "$GITHUB_WORKSPACE/scripts/udb-validate/validate.rb" \
              "$GITHUB_WORKSPACE/results-$SHARD.json" < ../shard.txt
          else
            echo '[]' > "$GITHUB_WORKSPACE/results-$SHARD.json"
          fi
        env:
          SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: udb-validate-${{ matrix.shard }}
          path: results-${{ matrix.shard }}.json
          retention-days: 30

  report:
    needs: [generate, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: udb-validate-*
          merge-multiple: true
      - name: Merge the shards
        run: node -e "const fs=require('fs');const all=fs.readdirSync('.').filter(f=>/^results-\d+\.json$/.test(f)).flatMap(f=>JSON.parse(fs.readFileSync(f,'utf8')));fs.writeFileSync('results.json',JSON.stringify(all));console.log(all.length+' results')"
      - name: Report
        env:
          MODE: ${{ needs.generate.outputs.mode }}
          UDB_REF: ${{ needs.generate.outputs.udb_ref }}
        run: |
          echo "Checked against riscv-unified-db \`$UDB_REF\`." >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" = single ]; then
            node scripts/udb-validate/report.mjs results.json --strict --summary "$GITHUB_STEP_SUMMARY"
          else
            node scripts/udb-validate/report.mjs results.json \
              --baseline scripts/udb-validate/baseline.json --summary "$GITHUB_STEP_SUMMARY"
          fi
