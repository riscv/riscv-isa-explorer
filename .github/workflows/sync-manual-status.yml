name: Sync ISA manual status

on:
  # Weekly, Monday 10:00 UTC, after the UDB sync (06:00) and its checks.
  #
  # Refreshes src/isa-manual-status.json from the ISA manual's prefaces. The
  # tests then compare the catalogue against it, so when the manual lists as
  # ratified something the catalogue (via riscv-unified-db) does not, this run
  # fails and sync-failure-alert.yml opens an issue naming it. That is how the
  # Sm 1.13 lag (riscv-unified-db#2740) would have been caught.
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-manual-status
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the explorer repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Clone riscv-isa-manual
        run: git clone --depth 1 https://github.com/riscv/riscv-isa-manual.git ../riscv-isa-manual

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Sync the manual's ratified list
        run: node scripts/sync_manual_status.mjs ../riscv-isa-manual

      # The render smoke test mounts the built bundle, so npm test needs dist/.
      - name: Build
        run: npm run build

      # tests/manual-status.test.mjs fails here if the catalogue disagrees with
      # the manual; no pull request opens, and the failure alert files an issue.
      - name: Validate the result
        run: npm test

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: 'data: sync the ISA manual ratified list'
          # Same identity for author and committer, so the Signed-off-by trailer
          # matches the author and DCO passes; sign-commits because main requires
          # signed commits. See sync-udb-extensions.yml for the full story.
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          sign-commits: true
          signoff: true
          title: 'data: sync the ISA manual ratified list'
          body: |
            Automated refresh of `src/isa-manual-status.json` from the prefaces of
            [riscv-isa-manual](https://github.com/riscv/riscv-isa-manual).

            `npm test` passed before this pull request was opened, so the
            catalogue agrees with the manual on every module it lists as ratified.

            Generated by the `sync-manual-status` workflow.
          branch: automated/sync-manual-status
          labels: automated,data-sync
