name: Feature request
description: Suggest a new feature or an improvement to the ISA Explorer
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! For a wrong dependency, a missing
        instruction, or a bad encoding, please use the **ISA data correction**
        template instead.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what makes it hard or impossible today?
      placeholder: When I ..., I can't ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature or change you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches or workarounds you have thought about.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app does this concern
      description: If you are not sure, choose Other.
      options:
        - Extensions view
        - ISA Configuration Builder
        - Compare
        - Encoding Map
        - Profiles
        - Downloads/exports
        - Other

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, links to specs, or anything else that helps.
    validations:
      required: false

  - type: checkboxes
    id: duplicates
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this has not been requested already.
          required: true
